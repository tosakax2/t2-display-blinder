<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T2 Display Blinder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="brand-title">T2 DISPLAY BLINDER</h1>
          <span class="brand-subtitle">System Utility v1.0</span>
        </div>
      </div>
      <div class="system-status" id="systemStatus">
        <span class="status-dot"></span>
        <span class="status-text" id="statusLabel">READY</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Quick Action Cards -->
      <section class="section-actions">
        <div class="action-grid">
          <!-- Screen Off Button -->
          <button class="action-card action-card-primary" id="btnScreenOff">
            <div class="card-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
                <line x1="12" y1="2" x2="12" y2="12"></line>
              </svg>
            </div>
            <div class="card-details">
              <div class="card-title">Screen Off</div>
              <div class="card-desc">Turn off display standby power</div>
            </div>
            <div class="card-shortcut">Ctrl+Alt+S</div>
          </button>

          <!-- Blackout Button -->
          <button class="action-card action-card-secondary" id="btnBlackout">
            <div class="card-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="9" y1="3" x2="9" y2="21"></line>
              </svg>
            </div>
            <div class="card-details">
              <div class="card-title">Blackout Screen</div>
              <div class="card-desc">Full-screen blackout overlay</div>
            </div>
            <div class="card-shortcut">Ctrl+Alt+B</div>
          </button>
        </div>
      </section>

      <!-- Timer Section -->
      <section class="section-timer">
        <div class="section-header">
          <div class="section-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span>Timer Control</span>
          </div>
          <span class="timer-mode-toggle" id="timerModeLabel">Target: Screen Off</span>
        </div>

        <div class="timer-controls">
          <div class="timer-preset-grid">
            <button class="timer-preset-btn" data-minutes="1">1 min</button>
            <button class="timer-preset-btn" data-minutes="5">5 min</button>
            <button class="timer-preset-btn" data-minutes="15">15 min</button>
            <button class="timer-preset-btn" data-minutes="30">30 min</button>
            <button class="timer-preset-btn" data-minutes="60">60 min</button>
          </div>

          <div class="timer-status-box hidden" id="timerStatusBox">
            <div class="timer-info-row">
              <span class="timer-countdown" id="timerCountdown">05:00</span>
              <button class="timer-cancel-btn" id="btnCancelTimer">Cancel</button>
            </div>
            <div class="progress-track">
              <div class="progress-bar" id="timerProgressBar"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- Shortcuts / Instructions Info Box -->
      <section class="section-info">
        <div class="info-card">
          <div class="info-row">
            <span class="info-label">Wake / Dismiss</span>
            <span class="info-value">Press any key (Esc) or move mouse</span>
          </div>
          <div class="info-row">
            <span class="info-label">Global Shortcuts</span>
            <span class="info-value">Active in background</span>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <div class="footer-note">T2 Display Blinder</div>
      <button class="footer-btn-exit" id="btnExit">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Exit</span>
      </button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
